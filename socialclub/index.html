<div class="feed">
  {% assign ordered = site.posts | sort: "date" | reverse %}
  {% for post in ordered %}
  <article class="feed-item">
    <h2 class="feed-item__title">{{ post.title }}</h2>
    <span class="feed-item__date">{{ post.date | date: "%B %Y" }}</span>
    {{ post.content }}
  </article>
  {% endfor %}
</div>
